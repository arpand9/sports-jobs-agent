services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sportshire
      POSTGRES_PASSWORD: sportshire
      POSTGRES_DB: sportshire
    ports:
      - "5432:5432"
    volumes:
      - sportshire_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportshire -d sportshire"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sportshire_pg:
